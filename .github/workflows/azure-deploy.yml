name: Deploy to Azure App Service

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn clean package -Pproduction -DskipTests

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: '{"clientId":"${{ secrets.AZUREAPPSERVICE_CLIENTID_7561431EAF4B4B789AD78620F5A5FEC1 }}","clientSecret":"","subscriptionId":"${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_2441720EDD61435ABA6E8AB7420830F8 }}","tenantId":"${{ secrets.AZUREAPPSERVICE_TENANTID_ADB0A00DE46464F8D70780154DC10A4 }}"}'

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'gameanalytics-backoffice'
          package: target/*.jar

      - name: Logout from Azure
        run: az logout